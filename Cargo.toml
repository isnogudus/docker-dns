[package]
name = "docker-dns"
version = "0.1.0"
edition = "2021"
description = "DNS server that resolves <name>.<ROOT_DOMAIN> to Docker container IPs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-server = "0.24"
hickory-proto = "0.24"
hickory-resolver = "0.24"
bollard = "0.17"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
